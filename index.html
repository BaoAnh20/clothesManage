


<!DOCTYPE html>
<html lang="vi">
<head>

<title>Bem Clothes Manager</title>
<!-- Liên kết đến file manifest -->
<link rel="manifest" href="manifest.json">

<!-- Tối ưu cho iOS (iPhone) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LAClothes">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/616/616408.png">

<!-- Tối ưu cho Android -->
<meta name="theme-color" content="#4a4ae1">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="active">Quản lý sản phẩm</a>
        <a href="product.html">Danh sách sản phẩm</a>
    </nav>

    <main class="container">
        <section class="add-card">
            <h3>✨ Thêm Sản Phẩm Mới</h3>
            <div class="form-group">
                <input type="text" id="item-name" placeholder="Tên món đồ...">
                <input type="number" id="item-price" placeholder="Giá tiền (VNĐ)...">
                <div class="file-input-wrapper">
                    <button class="btn-file">📸 Chọn ảnh</button>
                    <input type="file" id="item-image" accept="image/*">
                </div>
                <button id="btn-add" class="btn-main">Lưu vào hệ thống</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
